; KERS nach Reglement 2013: 60 kW, 400 kJ pro Runde, 6,67 s volle Leistung
; Lade- und Regler-Werte aus dem Cimmerian Iter 2013 Ferrari uebernommen, Drehmomentkurve
; auf konstant 60 kW ueber das Drehzahlband des F2004-V10 gelegt (siehe research/02-kers.md)
[HEADER]
VERSION=3

[KERS]
BRAKE_LEVEL=1.0                 ; Bremsanteil fuer volle Ladeleistung
CHARGE_K=0.0019                 ; Ladegewinn pro Sekunde und Radwinkelgeschwindigkeit (CIM 2013)
TORQUE_CURVE=kers_torque.lut    ; Nm ueber Motordrehzahl
ATTACH=ENGINE                   ; Moment auf die Kurbelwelle
DISCHARGE_TIME=6600             ; ms Vollentladung = 400 kJ / 60 kW
CONTROLLER=                     ; nur Knopf, kein automatischer Regler
NEGATIVE_INPUT_CHARGE_K=3
HAS_BUTTON_OVERRIDE=1
MAX_KJ_PER_LAP=400              ; kJ Abgabe pro Runde (Reglement 2009 bis 2013)
