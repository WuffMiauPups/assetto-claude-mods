; Porsche 956 Kurzheck, Ring 1983: Aero-Map-Abschnitt für aero.ini (CSP Extended Physics).
; Voraussetzung in car.ini: [HEADER] VERSION=extended-2
; Die [WING_N]-Abschnitte des Basis-Mods bleiben für Front und Heckflügel erhalten;
; ihr Cl muss so skaliert werden, dass sie zusammen etwa 40 Prozent des Gesamtabtriebs liefern
; (Zielwerte in tools/out/summary.json: cla_wing_rear, cla_wing_front).
; Der Unterboden kommt vollständig aus dem Kennfeld unten.

[MAP_0]
NAME=Unterboden Kurzheck
MAP_CL_RH=aero/underbody_cl_rh.2Dlut
MAP_CD_RH=aero/underbody_cd_rh.2Dlut
MAP_BALANCE_RH=aero/underbody_balance_rh.2Dlut
MAP_YAW_CL=aero/underbody_yaw_cl.lut
MAP_YAW_BALANCE=aero/underbody_yaw_balance.lut
FRONT_RH_OFFSET=0.000
REAR_RH_OFFSET=0.000
CL_MULT=1.00
CD_MULT=1.00
BALANCE_OFFSET=0.00
INTERPOLATION=CUBIC
DRAG_OFFSET=0.00, 0.35
; Kleine Werte = mehr Verzögerung = mehr Aufschaukeln. Startwerte bewusst etwas träge,
; damit das Porpoising spürbar, aber fahrbar bleibt. Im Test anpassen.
FRONT_FORCE_DELAY=0.035
REAR_FORCE_DELAY=0.030
DRAG_FORCE_DELAY=0.045
