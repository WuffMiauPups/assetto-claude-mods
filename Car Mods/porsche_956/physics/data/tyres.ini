[THERMAL_FRONT]

SURFACE_TRANSFER=0.0258		;How fast external sources heat the tyre tread touching the asphalt: Values 0-1
PATCH_TRANSFER=0.00028		;How fast heat transfers from one tyre location to the other: Values 0-1

CORE_TRANSFER=0.0005		;How fast heat transfers from tyre to inner air and back. Bidirectional.

INTERNAL_CORE_TRANSFER=0.0037		;How fast ROLLING_K transmits to core.This value is used to control how the heat generated by rolling (function of ROLLING_K , tyre angular velocity, load, pressure) transfer to the tyre core. Example value: 0.004

FRICTION_K=0.07232		;Quantity of slip becoming heat
ROLLING_K=0.146			;Rolling resistance heat

PERFORMANCE_CURVE=tcurve_slicks_front.lut		;File to use for temperature/grip relation

GRAIN_GAMMA=1 				; Gamma for the curve grain vs slip. higher number makes grain more influenced by slip

GRAIN_GAIN=0.5				; Gain for graining. How much gain raises with slip and temperature difference- 100 value = slipangle*(1+grain%)

BLISTER_GAMMA=1			; Gamma for the curve blistering vs slip. higher number makes blistering more influenced by slip

BLISTER_GAIN=0.5			; Gain for blistering. How much blistering raises with slip and temperature difference. think blistering more as heat cycles. 100 value = 20% less grip

COOL_FACTOR=1.76		;Speed up surface cooling as function of the square of the car speed. Example value: 1.5
SURFACE_ROLLING_K=0.7015		;Like ROLLING_K but dedicated to surfaces. Prior to V6 tire model, the ROLLING_K value was used to generate heat as function of rolling both for Core and Surface. From V6, ROLLING_K is used for Core and SURFACE_ROLLING_K is used for Surface.

