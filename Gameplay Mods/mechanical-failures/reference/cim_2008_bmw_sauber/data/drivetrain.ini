[HEADER]
VERSION=3

[TRACTION]
TYPE=RWD					; Wheel drive. Possible options: FWD (Front Wheel Drive), RWD (Rear Wheel Drive)

[GEARS]
COUNT=7
GEAR_R=-4.0

GEAR_1=3.4167
GEAR_2=2.2353
GEAR_3=1.8823
GEAR_4=1.6470
GEAR_5=1.4090
GEAR_6=1.2083
GEAR_7=1.0833
FINAL=6.7000




[DIFFERENTIAL]
POWER=0.25			; differential lock under power. 1.0=100% lock - 0 0% lock
COAST=0.55			; differential lock under coasting. 1.0=100% lock 0=0% lock
PRELOAD=15			; preload torque setting

[GEARBOX]
CHANGE_UP_TIME=10		; change up time in milliseconds
CHANGE_DN_TIME=20		; change down time in milliseconds
AUTO_CUTOFF_TIME=10	; Auto cutoff time for upshifts in milliseconds, 0 to disable
SUPPORTS_SHIFTER=0		; 1=Car supports shifter, 0=car supports only paddles 
VALID_SHIFT_RPM_WINDOW=1200			;range window additional to the precise rev matching rpm that permits gear engage.
CONTROLS_WINDOW_GAIN=0.3			;multiplayer for gas,brake,clutch pedals that permits gear engage on different rev matching rpm. the lower the more difficult.
INERTIA=0.012			;Gearbox inertia, default value if not set 0.02

[CLUTCH]
MAX_TORQUE=1150

[AUTOCLUTCH]
UPSHIFT_PROFILE=NONE			; Name of the autoclutch profile for upshifts. NONE to disable autoclutch on shift up
DOWNSHIFT_PROFILE=DOWNSHIFT_PROFILE	; Same as above for downshifts
USE_ON_CHANGES=1				; Use the autoclutch on gear shifts even when autoclutch is set to off. Needed for cars with semiautomatic gearboxes. values 1,0
MIN_RPM=2500					; Minimum rpm for autoclutch engadgement
MAX_RPM=3000					; Maximum rpm for autoclutch engadgement
FORCED_ON=0


[DOWNSHIFT_PROFILE]
POINT_0=1				; Time to reach fully depress clutch
POINT_1=15				; Time to start releasing clutch
POINT_2=20				; Time to reach fully released clutch

[AUTOBLIP]
ELECTRONIC=1				; If =1 then it is a feature of the car and cannot be disabled
POINT_0=15				; Time to reach full level
POINT_1=30				; Time to start releasing gas
POINT_2=55			; Time to reach 0 gas
LEVEL=1.4				; Gas level to be reached

[AUTO_SHIFTER]
UP=18800
DOWN=13000
SLIP_THRESHOLD=1.1
GAS_CUTOFF_TIME=0.020


[DOWNSHIFT_PROTECTION]
ACTIVE=0
DEBUG=0				; adds a line in the log for every missed downshift
OVERREV=1000		; How many RPM over the limiter the car is allowed to go
LOCK_N=1
